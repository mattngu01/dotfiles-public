set-window-option -g mode-keys vi
set-option -g mouse on
set -g status-style "bg=#1f1f1f,fg=white"
setw -g window-status-current-style "bg=#1f1f1f,fg=white,bold"

# Pane splits should open to the same path as the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# vim bindings for switching panes
# no repeat (-r) bc that's annoying
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
